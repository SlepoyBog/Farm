name: AI Content Farm

on:
  schedule:
    - cron: '0 6 * * *'   # 09:00 MSK
    - cron: '0 15 * * *'  # 18:00 MSK
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: farm-publish-main
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: 1

      - name: Run unit tests
        run: python -m unittest discover -v

      - id: generation
        name: Generate content and durable VK queue
        continue-on-error: true
        run: python src/main.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          VK_PUBLISH_ENABLED: "true"
          VK_PUBLISH_IMAGES: "false"
          # Deploy the article first so VK can render its Open Graph image.
          VK_DEFER_UNTIL_SITE_DEPLOY: "true"
          SITE_URL: ${{ secrets.SITE_URL || 'https://slepoybog.github.io/Farm' }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          DZEN_SESSION_COOKIE: ${{ secrets.DZEN_SESSION_COOKIE }}
          DZEN_DIRECT_ENABLED: "false"
          OK_ACCESS_TOKEN: ${{ secrets.OK_ACCESS_TOKEN }}
          OK_PUBLIC_KEY: ${{ secrets.OK_PUBLIC_KEY }}
          OK_APP_SECRET: ${{ secrets.OK_APP_SECRET }}
          OK_GROUP_ID: ${{ secrets.OK_GROUP_ID }}
          MAX_CONCURRENCY: ${{ vars.MAX_CONCURRENCY || '3' }}
          CONTENT_NICHE: "искусственный интеллект"

      - name: Checkpoint generated site and queue
        id: checkpoint
        if: ${{ !cancelled() && steps.generation.outcome != 'skipped' }}
        run: |
          git config user.name "Farm Bot"
          git config user.email "farm-bot@users.noreply.github.com"
          VERSION=$(cat VERSION)
          NEXT=$((VERSION + 1))
          echo "$NEXT" > VERSION
          git add VERSION site
          find data -maxdepth 1 -type f -name '*.json' -print0 | xargs -0 git add --
          if git diff --cached --quiet; then
            echo "Nothing to checkpoint"
          else
            git commit -m "v$NEXT: checkpoint generated state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish VK link card
        id: vk_publish
        continue-on-error: true
        run: python -m src.publish_pending_vk
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}

      - name: Update feedback model
        continue-on-error: true
        run: python src/feedback_loop.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_ANALYTICS_TOKEN: ${{ secrets.VK_ANALYTICS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}

      - name: Build farm health report
        if: always()
        run: python -m src.health_report

      - name: Finalize publication and analytics state
        id: finalize
        if: always()
        run: |
          git config user.name "Farm Bot"
          git config user.email "farm-bot@users.noreply.github.com"
          find data -maxdepth 1 -type f -name '*.json' -print0 | xargs -0 git add --
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Finalize publication state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce truthful workflow result
        if: always()
        env:
          GENERATION_OUTCOME: ${{ steps.generation.outcome }}
          CHECKPOINT_OUTCOME: ${{ steps.checkpoint.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          VK_OUTCOME: ${{ steps.vk_publish.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
        run: |
          if [ "$GENERATION_OUTCOME" != "success" ]; then
            echo "Generation failed; generated state was preserved."
            exit 1
          fi
          if [ "$CHECKPOINT_OUTCOME" != "success" ]; then
            echo "State checkpoint failed; publication was not started safely."
            exit 1
          fi
          if [ "$DEPLOY_OUTCOME" != "success" ]; then
            echo "GitHub Pages deployment failed."
            exit 1
          fi
          if [ "$VK_OUTCOME" != "success" ]; then
            echo "VK publication failed; pending queue was preserved."
            exit 1
          fi
          if [ "$FINALIZE_OUTCOME" != "success" ]; then
            echo "Final state persistence failed."
            exit 1
          fi
