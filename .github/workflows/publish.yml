name: AI Content Farm

on:
  schedule:
    - cron: '0 6 * * *'   # 09:00 MSK
    - cron: '0 15 * * *'  # 18:00 MSK
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: 1

      - name: Run unit tests
        run: python -m unittest discover -v

      - run: python src/main.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          # VK posts with images are published from site/rss.xml by Postmypost.
          # Keep the API token for compatibility, but prevent duplicate wall posts.
          VK_PUBLISH_ENABLED: "false"
          SITE_URL: ${{ secrets.SITE_URL || 'https://slepoybog.github.io/Farm' }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          DZEN_SESSION_COOKIE: ${{ secrets.DZEN_SESSION_COOKIE }}
          OK_ACCESS_TOKEN: ${{ secrets.OK_ACCESS_TOKEN }}
          OK_PUBLIC_KEY: ${{ secrets.OK_PUBLIC_KEY }}
          OK_APP_SECRET: ${{ secrets.OK_APP_SECRET }}
          OK_GROUP_ID: ${{ secrets.OK_GROUP_ID }}
          MAX_CONCURRENCY: ${{ vars.MAX_CONCURRENCY || '3' }}
          CONTENT_NICHE: "искусственный интеллект"

      # Publishing is the critical path. Deploy the fresh RSS before optional
      # analytics so an external reporting outage cannot stop VK delivery.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Collect Postmypost analytics
        continue-on-error: true
        run: python src/postmypost_analytics.py
        env:
          POSTMYPOST_API_TOKEN: ${{ secrets.POSTMYPOST_API_TOKEN }}
          POSTMYPOST_PROJECT_ID: "353549"
          POSTMYPOST_ACCOUNT_ID: "2205063"
          POSTMYPOST_ANALYTICS_DAYS: "30"

      - name: Update feedback model
        continue-on-error: true
        run: python src/feedback_loop.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_ANALYTICS_TOKEN: ${{ secrets.VK_ANALYTICS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}

      - name: Commit generated state and version bump
        run: |
          git config user.name "Farm Bot"
          git config user.email "farm-bot@users.noreply.github.com"
          VERSION=$(cat VERSION)
          NEXT=$((VERSION + 1))
          echo "$NEXT" > VERSION
          git add VERSION site
          find data -maxdepth 1 -type f -name '*.json' -print0 | xargs -0 git add --
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "v$NEXT: auto-deploy via CI [skip ci]"
            git push origin HEAD:main
          fi
